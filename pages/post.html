<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/post.css">
        <title>Criar publicação | Reportaki</title>
    </head>

    <body data-exige="cidadao">
        <header class="site-header">
            <a class="brand" href="home.html">Reportaki</a>

            <nav class="site-nav" aria-label="Navegação principal">
                <a href="home.html">Início</a>

                <a href="busca.html">Buscar cidade</a>

                <a href="feed.html">Feed</a>

                <a href="perfil.html">Perfil</a>
            </nav>
        </header>

        <main class="page-container page-content form-page">
            <div class="page-heading">
                <span class="eyebrow">Sua participação importa</span>

                <h1>Relatar um problema</h1>

                <p>Conte o que está acontecendo na sua cidade. Os campos marcados são obrigatórios.</p>
            </div>

            <form id="formPost" class="post-form">
                <label for="postCidade">Cidade</label>

                <input id="postCidade" name="cidade" type="text" list="lista-municipios" placeholder="Ex.: Jundiaí" maxlength="80" required>

                <label for="postEndereco">Endereço do local</label>

                <input id="postEndereco" name="endereco" type="text" placeholder="Ex.: Rua das Flores, nº 123, Centro" maxlength="180" required>

                <label for="postTitulo">Título da ocorrência</label>

                <input id="postTitulo" name="titulo" type="text" placeholder="Ex.: Buraco na rua" maxlength="100" required>

                <label for="postCategoria">Categoria</label>

                <select id="postCategoria" name="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="lixo">Lixo</option>
                    <option value="buraco">Buraco</option>
                    <option value="iluminacao">Iluminação pública</option>
                </select>

                <label for="postDescricao">Descrição</label>

                <textarea id="postDescricao" name="descricao" rows="5" maxlength="1000" placeholder="Descreva o problema e como ele afeta a região." required></textarea>

                <label for="postImagem">Foto do local (opcional)</label>

                <input id="postImagem" name="imagem" type="file" accept="image/*" aria-describedby="imagemAjuda">

                <p class="field-help">Anexe uma foto da ocorrência. Formatos de imagem comuns, até 10 MB.</p>

                <img id="imagemPreview" class="image-preview" alt="Prévia da foto selecionada" hidden>
                
                <div class="form-actions">
                    <a class="button button-secondary" href="feed.html">Cancelar</a><button class="button" type="submit">Publicar ocorrência</button>
                </div>

                <p id="formMensagem" class="form-message" role="status" hidden></p>
            </form>
        </main>
